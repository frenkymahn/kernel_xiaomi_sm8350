name: Build Next-Gen Kernel for Vili

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev g++-multilib libxml2-utils \
            bzip2 libbz2-dev libssl-dev python3 libncurses5 bc libelf-dev \
            clang lld llvm

      - name: Setup Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Setup KernelSU & Inject Configurations
        run: |
          # Clean broken submodule residue
          git submodule deinit -f --all || true
          rm -rf drivers/kernelsu KernelSU

          # Run official KernelSU setup
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          # Dynamically find the correct defconfig file
          DEFCONFIG=""
          for cfg in "arch/arm64/configs/vendor/lahaina-perf_defconfig" \
                     "arch/arm64/configs/vendor/lahaina_defconfig" \
                     "arch/arm64/configs/vendor/vili_defconfig" \
                     "arch/arm64/configs/vendor/vili-perf_defconfig" \
                     "arch/arm64/configs/lahaina-perf_defconfig" \
                     "arch/arm64/configs/vili_defconfig"; do
            if [ -f "$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            # Search if not found in standard paths
            DEFCONFIG=$(find arch/arm64/configs -name "*lahaina-perf*" -o -name "*vili*" | head -n 1)
          fi

          echo "Using defconfig: $DEFCONFIG"
          echo "TARGET_DEFCONFIG_FILE=$DEFCONFIG" >> $GITHUB_ENV
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # Inject Localversion
          sed -i '/CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> "$DEFCONFIG"

          # Inject required configs
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

      - name: Compile Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Alan"
          export KBUILD_BUILD_HOST="Builder"

          # Load defconfig
          if [ -f "arch/arm64/configs/vendor/$DEFCONFIG_NAME" ]; then
            make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "vendor/$DEFCONFIG_NAME"
          else
            make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "$DEFCONFIG_NAME"
          fi

          # Build Image
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            LD=ld.lld

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git zipper

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image zipper/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz zipper/
          fi

          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb zipper/
          fi

          cd zipper
          zip -r9 ../Next-Gen-KangarooX-Vili-HyperOS.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Kernel-Vili
          path: Next-Gen-KangarooX-Vili-HyperOS.zip
