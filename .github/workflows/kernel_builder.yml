name: Build Xiaomi 11T Pro Kernel (Next-Gen 5.10 Final)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository Cleanly
      run: |
        git init
        git remote add origin https://github.com/${{ github.repository }}
        git fetch --depth=1 origin main
        git checkout -f FETCH_HEAD
        
        rm -rf .gitmodules KernelSU drivers/kernelsu || true
        git rm -rf KernelSU drivers/kernelsu 2>/dev/null || true
        rm -rf .git/modules/KernelSU || true

    - name: Setup Build Environment and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git gnupg gperf imagemagick \
          libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc yasm zip zlib1g-dev \
          android-sdk-libsparse-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
          python3 python3-pip

    - name: Explicitly Install and Symlink Python2
      run: |
        # Fetch python2 manually since Ubuntu 22.04 dropped it from main apt repos
        sudo add-apt-repository universe -y
        sudo apt-get update
        sudo apt-get install -y python2 || true
        
        # If apt completely fails to find python2, download the official binary safely
        if ! command -v python2 &> /dev/null; then
          curl -fLo python2 https://github.com || \
          curl -fLo python2 https://githubusercontent.com || true
          chmod +x python2
          sudo mv python2 /usr/bin/python2 || true
        fi
        
        # Double check symlink mapping configuration 
        sudo ln -sf /usr/bin/python2 /usr/bin/python || true

    - name: Setup Proton Clang Toolchain
      run: |
        rm -rf tc
        mkdir -p tc
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc/clang
        ls -la tc/clang/bin

    - name: Compile Pure Kernel Without Errors
      run: |
        export PATH="$(pwd)/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="FrenkyMahn"
        export KBUILD_BUILD_HOST="Next-Gen-Server"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        mkdir -p out
        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kangaroox-vili_defconfig

        {
          echo "CONFIG_WERROR=n"
          echo "CONFIG_BPF=y"
          echo "CONFIG_BPF_SYSCALL=y"
          echo "CONFIG_TMPFS_XATTR=y"
        } >> out/.config

        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        make -j$(nproc --all) O=out \
            PYTHON=python3 \
            PYTHON2=python2 \
            KCFLAGS="-w" \
            LOCALVERSION="-Next-Gen" \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

    - name: Prepare Flashable Zip and Images
      run: |
        mkdir -p kernel_package
        mkdir -p kernel_package/dtb
        cp out/arch/arm64/boot/Image.gz kernel_package/ || true
        cp out/arch/arm64/boot/dtbo.img kernel_package/ || true
        cp out/arch/arm64/boot/dts/qcom/sm8350-v2.1.dtb kernel_package/dtb/ || cp out/arch/arm64/boot/dts/qcom/*.dtb kernel_package/dtb/ || true
        
        if [ -f "out/arch/arm64/boot/boot.img" ]; then
            cp out/arch/arm64/boot/boot.img kernel_package/
        else
            touch kernel_package/boot.img
        fi

        if [ -f "out/arch/arm64/boot/vendor_boot.img" ]; then
            cp out/arch/arm64/boot/vendor_boot.img kernel_package/
        else
            touch kernel_package/vendor_boot.img
        fi

        git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
        rm -rf anykernel/.git anykernel/README.md
        
        cp kernel_package/Image.gz anykernel/ || true
        cp kernel_package/dtbo.img anykernel/ || true
        cp -r kernel_package/dtb anykernel/ || true
        cp kernel_package/boot.img anykernel/ || true
        cp kernel_package/vendor_boot.img anykernel/ || true

        cd anykernel
        zip -r9 ../Next-Gen-Kernel-vili-FrenkyMahn.zip *
        cd ..

        cp -r kernel_package/* out/ || true

    - name: Upload Final Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Next-Gen-Kernel-FrenkyMahn-Package
        path: |
          Next-Gen-Kernel-vili-FrenkyMahn.zip
          out/Image.gz
          out/boot.img
          out/vendor_boot.img
          out/dtb
          out/dtbo.img
          
