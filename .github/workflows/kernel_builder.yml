name: Build Next-Gen Kernel for Vili

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev g++-multilib libxml2-utils \
            bzip2 libbz2-dev libssl-dev python3 libncurses5 bc libelf-dev \
            clang lld llvm

      - name: Setup Clang Toolchain (AOSP Clang r450784d)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r450784d.git clang

      - name: Setup KernelSU & Inject Configurations
        run: |
          # Setup KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          # Determine the target defconfig file
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-perf_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vili_defconfig"
          fi

          echo "Target defconfig: $DEFCONFIG"

          # Inject Localversion
          sed -i '/CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> "$DEFCONFIG"

          # Inject OverlayFS, XATTR, and KernelSU support flags
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

      - name: Compile Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Alan"
          export KBUILD_BUILD_HOST="Builder"

          # Check which defconfig to load
          if [ -f "arch/arm64/configs/vendor/lahaina-perf_defconfig" ]; then
            make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- vendor/lahaina-perf_defconfig
          else
            make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- vili_defconfig
          fi

          # Start compilation
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            LD=ld.lld

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git zipper
          
          # Copy compiled Image
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image zipper/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz zipper/
          fi

          # Copy DTB if present
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb zipper/
          fi

          cd zipper
          zip -r9 ../Next-Gen-KangarooX-Vili-HyperOS.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Kernel-Vili
          path: Next-Gen-KangarooX-Vili-HyperOS.zip
