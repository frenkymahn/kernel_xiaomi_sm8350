name: Build Next-Gen Kernel for Vili (MIUI & HyperOS Only)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Purge Broken Submodules
        run: |
          git submodule deinit -f --all 2>/dev/null || true
          git config --file .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
          git config --remove-section submodule.KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU .gitmodules drivers/kernelsu KernelSU

      - name: Install Essential Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev libxml2-utils device-tree-compiler \
            bzip2 libbz2-dev libssl-dev python3 libncurses5 bc libelf-dev tar \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Direct Official AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 clang-prebuilts
          mkdir -p clang
          LATEST_CLANG=$(ls -d clang-prebuilts/clang-r* | tail -n 1)
          cp -r $LATEST_CLANG/* clang/
          rm -rf clang-prebuilts

      - name: Setup Matching KernelSU Drivers
        run: |
          # Clone KernelSU v0.9.5 which exactly matches the ksu_handle_* hooks in your fs/ files
          rm -rf drivers/kernelsu
          git clone --depth=1 -b v0.9.5 https://github.com/tiann/KernelSU.git drivers/kernelsu

          # Ensure drivers/Makefile builds KernelSU
          if ! grep -q "obj-\$(CONFIG_KSU) += kernelsu/" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # Fix Kconfig path if required
          if [ -f "drivers/kernelsu/kernel/Kconfig" ] && [ ! -f "drivers/kernelsu/Kconfig" ]; then
            ln -s kernel/Kconfig drivers/kernelsu/Kconfig
          fi

      - name: Inject Configurations
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/kangaroox-vili_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*kangaroox-vili*" -o -name "*vili*" | head -n 1)
          fi

          echo "Target defconfig: $DEFCONFIG"
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # Inject Localversion
          sed -i '/CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> "$DEFCONFIG"

          # Required configurations
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

          # MIUI & HyperOS Essentials
          echo "CONFIG_MIUI_FREQUENT_APP=y" >> "$DEFCONFIG"
          echo "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=y" >> "$DEFCONFIG"
          echo "CONFIG_INPUT_TOUCHSCREEN=y" >> "$DEFCONFIG"
          echo "CONFIG_ZRAM=y" >> "$DEFCONFIG"
          echo "CONFIG_FS_ENCRYPTION=y" >> "$DEFCONFIG"

      - name: Compile Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="FrenkyMahn"
          export KBUILD_BUILD_HOST="Builder"

          # Load defconfig
          if [ -f "arch/arm64/configs/vendor/$DEFCONFIG_NAME" ]; then
            make O=out CC=clang "vendor/$DEFCONFIG_NAME"
          else
            make O=out CC=clang "$DEFCONFIG_NAME"
          fi

          # Force CONFIG_KSU in generated .config
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -e TMPFS_XATTR

          # Compile Image & dtbs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git zipper

          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' zipper/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vili/g' zipper/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=vili_in/g' zipper/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=2107113SI/g' zipper/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=2107113SG/g' zipper/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' zipper/anykernel.sh

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz zipper/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image zipper/
          fi

          find out/arch/arm64/boot/dts/vendor/qcom -name "*sm8350*.dtb" -exec cat {} + > zipper/dtb 2>/dev/null || true
          [ ! -s zipper/dtb ] && [ -f out/arch/arm64/boot/dtb ] && cp out/arch/arm64/boot/dtb zipper/dtb

          cd zipper
          zip -r9 ../Next-Gen-HyperOS-Vili.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-Vili
          path: Next-Gen-HyperOS-Vili.zip
