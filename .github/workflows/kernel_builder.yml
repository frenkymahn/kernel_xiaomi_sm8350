    - name: Setup KernelSU and Compile Kernel
      run: |
        export PATH="$(pwd)/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="FrenkyMahn"
        export KBUILD_BUILD_HOST="Next-Gen-Server"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # ലോക്കൽ KernelSU ഫോൾഡർ ശരിയായ രീതിയിൽ സെറ്റപ്പ് ചെയ്യുക
        if [ -d "KernelSU" ]; then
            rm -rf drivers/kernelsu
            mv KernelSU drivers/kernelsu
        elif [ ! -d "drivers/kernelsu" ]; then
            git clone https://github.com/tiann/KernelSU.git -b main drivers/kernelsu
        fi

        # KernelSU setup integration (if setup script exists)
        if [ -f "drivers/kernelsu/kernel/setup.sh" ]; then
            bash drivers/kernelsu/kernel/setup.sh || true
        fi

        mkdir -p out
        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kangaroox-vili_defconfig

        {
          echo "CONFIG_WERROR=n"
          echo "CONFIG_KSU=y"
          echo "CONFIG_BPF=y"
          echo "CONFIG_BPF_SYSCALL=y"
          echo "CONFIG_TMPFS_XATTR=y"
        } >> out/.config

        make O=out ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        make -j$(nproc --all) O=out \
            PYTHON=python3 \
            KCFLAGS="-w" \
            LOCALVERSION="-Next-Gen-by-FrenkyMahn" \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip
            
