name: Build Next-Gen Kernel for Vili (MIUI & HyperOS Only)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Purge Broken Submodules
        run: |
          git submodule deinit -f --all 2>/dev/null || true
          git config -f .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
          git config --remove-section submodule.KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU .gitmodules drivers/kernelsu KernelSU

      - name: Install Essential Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev libxml2-utils device-tree-compiler \
            bzip2 libbz2-dev libssl-dev python3 libncurses5 bc libelf-dev tar \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Direct Official AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 clang-prebuilts
          mkdir -p clang
          LATEST_CLANG=$(ls -d clang-prebuilts/clang-r* | tail -n 1)
          cp -r $LATEST_CLANG/* clang/
          rm -rf clang-prebuilts

      - name: Setup KernelSU Properly
        run: |
          # Official setup script wires drivers and links hooks cleanly
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Inject HyperOS Configurations
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/kangaroox-vili_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*kangaroox-vili*" -o -name "*vili*" | head -n 1)
          fi

          echo "Target defconfig: $DEFCONFIG"
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # Inject Localversion
          sed -i '/CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> "$DEFCONFIG"

          # User requested & KernelSU configs
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

          # HyperOS 3 / MIUI Hardware Drivers
          echo "CONFIG_MIUI_FREQUENT_APP=y" >> "$DEFCONFIG"
          echo "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=y" >> "$DEFCONFIG"
          echo "CONFIG_INPUT_TOUCHSCREEN=y" >> "$DEFCONFIG"
          echo "CONFIG_ZRAM=y" >> "$DEFCONFIG"
          echo "CONFIG_FS_ENCRYPTION=y" >> "$DEFCONFIG"

      - name: Compile Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="FrenkyMahn"
          export KBUILD_BUILD_HOST="Builder"

          # Load defconfig
          if [ -f "arch/arm64/configs/vendor/$DEFCONFIG_NAME" ]; then
            make O=out CC=clang "vendor/$DEFCONFIG_NAME"
          else
            make O=out CC=clang "$DEFCONFIG_NAME"
          fi

          # Compile Image, DTBs, and DTBO
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image dtbs dtbo.img

      - name: Package with AnyKernel3 (HyperOS Boot & Vendor_Boot Mod)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git zipper

          # Write your verified AnyKernel3 script
          cat << 'EOF' > zipper/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Next-Gen for FrenkyMahn 
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Xiaomi 11T Pro
          device.name2=milahaina
          device.name3=vili
          supported.versions=11.0-17.0
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot install — MIUI/HyperOS: replace kernel in boot partition.
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && passthrough;

          dump_boot;
          write_boot;
          ## end boot install

          ## vendor_boot — flash our DTB + empty modules.load (fix slow boot/loop)
          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          reset_ak;

          split_boot;
          unpack_ramdisk;

          find $AKHOME/ramdisk/lib/modules -name "modules.load" -exec sh -c 'echo -n > {}' \;
          find $AKHOME/ramdisk/lib/modules -name "modules.dep" -exec sh -c 'echo -n > {}' \;

          repack_ramdisk;
          flash_boot;
          ## end vendor_boot install
          EOF

          # Copy Image
          cp out/arch/arm64/boot/Image zipper/

          # Concatenate and copy DTB
          find out/arch/arm64/boot/dts/vendor/qcom -name "*sm8350*.dtb" -o -name "*vili*.dtb" -exec cat {} + > zipper/dtb 2>/dev/null || true
          [ ! -s zipper/dtb ] && [ -f out/arch/arm64/boot/dtb ] && cp out/arch/arm64/boot/dtb zipper/dtb || true

          # Copy DTBO if generated
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img zipper/
          fi

          cd zipper
          zip -r9 ../Next-Gen-HyperOS-Vili.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-Vili
          path: Next-Gen-HyperOS-Vili.zip
