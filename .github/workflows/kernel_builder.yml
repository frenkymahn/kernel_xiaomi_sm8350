name: Xiaomi 11T Pro Kernel Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source and Clean Modules
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Force Remove Git Modules Before Anything Else
        run: |
          rm -rf .gitmodules
          rm -rf KernelSU drivers/kernelsu || true

      - name: Install Toolchain & Linkers
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential gcc-10 g++-10 gcc-10-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses5-dev bison flex bc git libssl-dev wget zip cpio python3 python3-pip
          
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-ld.bfd /usr/bin/aarch64-linux-gnu-ld

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="frenkymahn-PC"
          
          export PATH=/usr/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          
          mkdir -p out
          make O=out kangaroox-vili_defconfig
          
          make O=out olddefconfig

          make -j$(nproc) O=out \
            HOSTCC=gcc-10 \
            HOSTCXX=g++-10 \
            CC=aarch64-linux-gnu-gcc \
            LD=aarch64-linux-gnu-ld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-Dark_kernel" \
            Image.gz-dtb dtbo.img

      - name: Package Images
        run: |
          mkdir -p final_images
          cp out/arch/arm64/boot/Image.gz-dtb final_images/
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img final_images/
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp final_images/Image.gz-dtb ak3/
          [ -f final_images/dtbo.img ] && cp final_images/dtbo.img ak3/dtbo.img
          cd ak3 && zip -r ../Xiaomi-11T-Pro-DarkKernel.zip * && cd ..

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Kernel-Images
          path: |
            final_images/*
            Xiaomi-11T-Pro-DarkKernel.zip
