name: Xiaomi 11T Pro Kernel Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source Cleanly
        run: |
          rm -rf .git* || true
          git clone --depth=1 https://github.com/frenkymahn/kernel_xiaomi_sm8350.git source_tmp
          shopt -s dotglob
          mv source_tmp/* .
          rm -rf source_tmp .gitmodules || true

      - name: Setup Environment & Download Proper AOSP Clang
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential libncurses5-dev bison flex bc git libssl-dev wget zip cpio python3 python3-pip
          
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          # Clone a robust and standard AOSP Clang toolchain that supports modern -mcpu flags
          git clone --depth=1 https://gitlab.com/ThankYouMario/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang || \
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902 clang

      - name: Compile Kernel with Proper Clang Toolchain
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="frenkymahn-PC"
          
          export PATH="${{ github.workspace }}/clang/bin:/usr/bin:$PATH"
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          make O=out kangaroox-vili_defconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="-Dark_kernel" \
            Image.gz

      - name: Package Images & AnyKernel3
        run: |
          mkdir -p final_images
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz final_images/
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb final_images/
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp final_images/* ak3/ || true
          cd ak3 && zip -r ../Xiaomi-11T-Pro-DarkKernel.zip * && cd ..

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Kernel-Images
          path: |
            final_images/*
            Xiaomi-11T-Pro-DarkKernel.zip
