name: Build Production SM8350 HyperOS Kernel for Xiaomi 11T Pro (vili)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Tree
        uses: actions/checkout@v4

      - name: System Environment and Toolchain Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32z1-dev liblz4-tool libncurses6 libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang lld llvm libcap-dev python3 libelf-dev binutils-aarch64-linux-gnu
          
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5

      - name: Pull Kernel Source and 5.10 Clang Target Toolchain
        run: |
          git clone --depth=1 https://github.com/frenkymahn/kernel_xiaomi_sm8350.git kernel-source
          
          mkdir -p clang
          cd clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz || curl -LO https://gitlab.com/ThankYouMario/android_prebuilts_clang_host_linux-x86_clang-r416183b/-/raw/main/clang-r416183b.tar.gz
          cd ..
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Inject Xiaomi HyperOS and Android 14-17 Defconfig Tunings
        run: |
          cd kernel-source/arch/arm64/configs/
          
          if [ -f gki_defconfig ]; then
            DEFCONFIG_NAME="gki_defconfig"
          else
            DEFCONFIG_NAME=$(ls *_defconfig | head -n 1)
          fi
          
          echo "Using defconfig: $DEFCONFIG_NAME"
          
          echo "" >> "$DEFCONFIG_NAME"
          echo "# ========================================================" >> "$DEFCONFIG_NAME"
          echo "# SM8350 HYPEROS 5.10 KERNEL PRODUCTION CONFIG" >> "$DEFCONFIG_NAME"
          echo "# ========================================================" >> "$DEFCONFIG_NAME"
          echo "CONFIG_BOARD_USES_VENDOR_BOOT=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=n" >> "$DEFCONFIG_NAME"
          echo "CONFIG_BPF=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_BPF_SYSCALL=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_BPF_JIT=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_CGROUP_BPF=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_NET_CLS_ACT=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_NET_ACT_BPF=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_ALWAYS_PERMISSIVE=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$DEFCONFIG_NAME"
          echo "CONFIG_DM_VERITY=n" >> "$DEFCONFIG_NAME"
          echo "CONFIG_FORCE_DM_VERITY_FORCE_BURST=n" >> "$DEFCONFIG_NAME"
          echo "CONFIG_VDSO=n" >> "$DEFCONFIG_NAME"
          echo "CONFIG_LOCALVERSION=\"-Next-Gen-Vili\"" >> "$DEFCONFIG_NAME"

      - name: Clean Source-Level Patches for 5.10 Clang Compatibility
        run: |
          cd kernel-source
          
          cat << 'EOF' > arch/arm64/include/asm/stack_pointer.h
          #ifndef __ASM_STACK_POINTER_H
          #define __ASM_STACK_POINTER_H
          static inline unsigned long __current_stack_pointer(void)
          {
              unsigned long sp;
              __asm__ ("mov %0, sp" : "=r" (sp));
              return sp;
          }
          #define current_stack_pointer (__current_stack_pointer())
          #endif
          EOF

          if [ -f arch/arm64/include/asm/kgdb.h ]; then
            sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM));/\/* asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM)); *\//g' arch/arm64/include/asm/kgdb.h || true
          fi

          if [ -d arch/arm64/kernel/vdso ]; then
            rm -f arch/arm64/kernel/vdso/*.S arch/arm64/kernel/vdso/*.c arch/arm64/kernel/vdso/*.lds
            touch arch/arm64/kernel/vdso/vdso.S
          fi

      - name: Configure AnyKernel3 Script for Android 14-17 HyperOS Support
        run: |
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Next-Gen-Vili HyperOS 5.10 Master Kernel - Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=vili
          device.name2=vili_in
          device.name3=vili_cn
          device.name4=vili_eu
          supported.versions=14,14.0,15,15.0,16,16.0,17,17.0
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          ui_print "-> Flashing Next-Gen-Vili HyperOS Kernel Image to boot partition...";
          dump_boot;
          write_boot;

          if [ -f dtbo.img ]; then
            ui_print "-> Flashing updated hardware dtbo tree...";
            BLOCK=dtbo;
            IS_SLOT_DEVICE=auto;
            flash_dtbo;
          fi

          if [ -f vendor_boot.img ] || [ -f dtb ]; then
            ui_print "-> Patching and flashing vendor_boot container for HyperOS...";
            BLOCK=vendor_boot;
            IS_SLOT_DEVICE=auto;
            RAMDISK_COMPRESSION=auto;
            PATCH_VBMETA_FLAG=auto;
            reset_ak;
            split_boot;
            flash_boot;
          fi
          EOF

      - name: Execute Main Kernel Build Process (5.10 Clang Target)
        run: |
          cd kernel-source
          
          export TOOLCHAIN_BIN="$(pwd)/../clang/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          rm -rf out
          
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            TARGET_DEF="gki_defconfig"
          else
            TARGET_DEF=$(ls arch/arm64/configs/*_defconfig | head -n 1 | xargs basename)
          fi
          
          make -j$(nproc --all) O=out "$TARGET_DEF"
          
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="-Wno-error=inline-asm -Wno-error=register -Wno-error=unused-command-line-argument -Wno-error=section"
          
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="-Wno-error=inline-asm -Wno-error=register -Wno-error=unused-command-line-argument -Wno-error=section" \
            modules
            
          make -j$(nproc --all) O=out \
            INSTALL_MOD_PATH=../modules_out \
            modules_install

      - name: Stage Assets and Package Universal Flashable ZIP
        run: |
          cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          cp kernel-source/out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          
          if [ -f kernel-source/out/arch/arm64/boot/dts/vendor/qcom/vili.dtb ]; then
            cp kernel-source/out/arch/arm64/boot/dts/vendor/qcom/vili.dtb AnyKernel3/dtb
          elif [ -f kernel-source/out/arch/arm64/boot/dtb ] ; then
            cp kernel-source/out/arch/arm64/boot/dtb AnyKernel3/dtb
          else
            find kernel-source/out/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb || true
          fi
          
          mkdir -p AnyKernel3/vendor_ramdisk/modules
          find modules_out/ -name "*.ko" -exec cp {} AnyKernel3/vendor_ramdisk/modules/ \;

          cd AnyKernel3
          zip -r9 ../Next-Gen-Vili-HyperOS-Universal.zip * -x .git\* README.md

      - name: Upload Production Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-Vili-HyperOS-Kernel-5.10
          path: Next-Gen-Vili-HyperOS-Universal.zip
          
