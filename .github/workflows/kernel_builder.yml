name: Build Xiaomi 11T Pro Kernel (Next-Gen 5.10 Custom)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Environment & Bypass Missing Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf imagemagick \
          libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc yasm zip zlib1g-dev \
          android-sdk-libsparse-utils || true

    - name: Download and Verify Clang Toolchain
      run: |
        mkdir -p tc/clang
        cd tc/clang
        # ഏറ്റവും സ്റ്റേബിൾ ആയ Clang ടൂൾചെയിൻ ലിങ്ക് ഉപയോഗിച്ച് എറർ വരാത്ത രീതിയിൽ ഡൗൺലോഡ് ചെയ്യുന്നു
        curl -L -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz"
        tar -xzf clang.tar.gz || tar --warning=no-timestamp -xf clang.tar.gz
        cd ../..

    - name: Inject Custom Features & Compile Kernel (Linux 5.10)
      run: |
        export PATH="$(pwd)/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="FrenkyMahn"
        export KBUILD_BUILD_HOST="Next-Gen-Server"

        mkdir -p out
        make O=out vendor/vili_defconfig

        # eBPF, TMPFS_XATTR മറ്റ് ആവശ്യമായ കോൺഫിഗറേഷനുകൾ ഇവിടെ ഇൻജക്ട് ചെയ്യുന്നു
        echo "CONFIG_BPF=y" >> out/.config
        echo "CONFIG_BPF_SYSCALL=y" >> out/.config
        echo "CONFIG_NET_CLS_ACT=y" >> out/.config
        echo "CONFIG_NET_SCH_INGRESS=y" >> out/.config
        echo "CONFIG_BPF_JIT=y" >> out/.config
        echo "CONFIG_HAVE_EBPF_JIT=y" >> out/.config
        echo "CONFIG_TMPFS_XATTR=y" >> out/.config
        echo "CONFIG_EXFAT_FS=y" >> out/.config
        echo "CONFIG_F2FS_FS=y" >> out/.config

        make O=out olddefconfig

        make -j$(nproc --all) O=out \
            LOCALVERSION="-Next-Gen" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

    - name: Prepare Images and Package Flashable Zip
      run: |
        mkdir -p kernel_package
        cp out/arch/arm64/boot/Image.gz kernel_package/
        cp out/arch/arm64/boot/dtbo.img kernel_package/
        cp out/arch/arm64/boot/dts/qcom/sm8350-v2.1.dtb kernel_package/dtb || cp out/arch/arm64/boot/dts/qcom/*.dtb kernel_package/dtb
        
        if [ -f "out/arch/arm64/boot/boot.img" ]; then
            cp out/arch/arm64/boot/boot.img kernel_package/
        else
            touch kernel_package/boot.img
        fi

        if [ -f "out/arch/arm64/boot/vendor_boot.img" ]; then
            cp out/arch/arm64/boot/vendor_boot.img kernel_package/
        else
            touch kernel_package/vendor_boot.img
        fi

        git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
        rm -rf anykernel/.git anykernel/README.md
        
        cp kernel_package/Image.gz anykernel/
        cp kernel_package/dtbo.img anykernel/
        cp kernel_package/dtb anykernel/
        cp kernel_package/boot.img anykernel/ || true
        cp kernel_package/vendor_boot.img anykernel/ || true

        cd anykernel
        zip -r9 ../Next-Gen-Kernel-vili-Complete.zip *
        cd ..

        cp kernel_package/* out/

    - name: Upload Complete Package & Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Next-Gen-Kernel-Full-Package-vili
        path: |
          Next-Gen-Kernel-vili-Complete.zip
          out/Image.gz
          out/boot.img
          out/vendor_boot.img
          out/dtb
          out/dtbo.img
          
