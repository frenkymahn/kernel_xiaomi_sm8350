name: Xiaomi 11T Pro Kernel Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source Manually
        run: |
          rm -rf .git* || true
          git clone --depth=1 https://github.com/frenkymahn/kernel_xiaomi_sm8350.git source_tmp
          shopt -s dotglob
          mv source_tmp/* .
          rm -rf source_tmp .gitmodules || true

      - name: Install Toolchain & Stable Clang
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential libncurses5-dev bison flex bc git libssl-dev wget zip cpio python3 python3-pip
          
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          # Use a stable and fast prebuilt Clang repository to avoid tar/auth errors
          git clone --depth=1 https://github.com/kdrag0n/aarch64-elf-gcc.git gcc64 || true
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r416183b clang || \
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902 bsd_clang || true

          if [ -d "clang/bin" ]; then
            echo "Clang ready"
          elif [ -d "bsd_clang/bin" ]; then
            mv bsd_clang clang
          fi

      - name: Compile Kernel with Clang
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="frenkymahn-PC"
          
          export PATH="${{ github.workspace }}/clang/bin:/usr/bin:$PATH"
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          make O=out kangaroox-vili_defconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="-Dark_kernel" \
            Image.gz dtbo.img

      - name: Package Images
        run: |
          mkdir -p final_images
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz final_images/
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb final_images/
          fi
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img final_images/
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp final_images/* ak3/ || true
          cd ak3 && zip -r ../Xiaomi-11T-Pro-DarkKernel.zip * && cd ..

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Kernel-Images
          path: |
            final_images/*
            Xiaomi-11T-Pro-DarkKernel.zip
